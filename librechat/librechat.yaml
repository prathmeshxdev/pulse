# LibreChat config — MCP + optional LiteLLM custom endpoint.
# LLM URL/key: set LITELLM_BASE_URL + LITELLM_API_KEY in root .env (gitignored),
# then run clickhouse/scripts/sync_librechat_env.sh — never commit corp proxy URLs.
version: 1.2.1

mcpSettings:
  allowedAddresses:
    - "clickhouse-mcp:8001"

interface:
  modelSelect: true
  parameters: true
  presets: true
  agents:
    use: true
    create: true
    share: false
    public: false
  mcpServers:
    use: true
    share: false
    create: false
    public: false

endpoints:
  agents:
    disableBuilder: false
    capabilities:
      - tools
      - actions
      - context
  custom:
    - name: "LiteLLM"
      apiKey: "sk-pulse-litellm-local"
      baseURL: "${LITELLM_BASE_URL}"
      models:
        default: ["claude-sonnet-5"]
        fetch: true
      titleConvo: true
      titleModel: "claude-sonnet-5"
      summarize: false
      modelDisplayLabel: "LiteLLM"

mcpServers:
  clickhouse:
    type: sse
    url: http://clickhouse-mcp:8001/sse
    description: >
      Read-only ClickHouse access to the Sony LIV concurrency serving layer
      (session_active_segments, minute_deltas, content_dict). Use for peak/avg
      concurrency questions with dimension filters.
