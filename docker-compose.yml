# Pulse — local run against ClickHouse Cloud (set CLICKHOUSE_DSN in .env).
#
#   Core (API + dashboard + Redis):
#     podman-compose up backend frontend redis
#
#   + ClickStack observability (OTLP :4318 → ClickHouse Cloud):
#     ./clickhouse/scripts/sync_librechat_env.sh   # writes observability.env
#     podman-compose --profile observability up -d
#     # OTEL_EXPORTER_OTLP_ENDPOINT=http://localhost:4318
#
#   + LibreChat conversational layer (UI :3080, MCP :8001):
#     ./clickhouse/scripts/sync_librechat_env.sh   # once
#     podman-compose --profile chat up -d
#
#   Everything:
#     podman-compose --profile full up -d
#
#   Local ClickHouse (dev only, not Cloud):
#     docker compose --profile local up

services:
  clickhouse:
    image: clickhouse/clickhouse-server:25.3
    profiles: ["local"]
    ports:
      - "8123:8123"
      - "9000:9000"
    ulimits:
      nofile: { soft: 262144, hard: 262144 }
    volumes:
      - ch-data:/var/lib/clickhouse

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  clickstack:
    image: clickhouse/clickstack-otel-collector:latest
    profiles: ["observability", "full"]
    restart: unless-stopped
    env_file:
      - ./observability.env
    ports:
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP  ← OTEL_EXPORTER_OTLP_ENDPOINT target

  librechat-mongodb:
    image: mongo:7
    profiles: ["chat", "full"]
    restart: unless-stopped
    volumes:
      - librechat-mongo:/data/db

  clickhouse-mcp:
    image: mcp/clickhouse:latest
    profiles: ["chat", "full"]
    restart: unless-stopped
    env_file:
      - ./librechat/.env
    environment:
      CLICKHOUSE_READONLY: "1"
      CLICKHOUSE_MCP_SERVER_TRANSPORT: sse
      CLICKHOUSE_MCP_BIND_HOST: 0.0.0.0
      CLICKHOUSE_MCP_BIND_PORT: "8001"
    ports:
      - "8001:8001"

  pulse-mcp:
    build: ./librechat/pulse-mcp
    profiles: ["chat", "full"]
    restart: unless-stopped
    environment:
      # Override to http://host.containers.internal:8080 when API runs on host (go run).
      PULSE_API_URL: ${PULSE_API_URL:-http://backend:8080}
    ports:
      - "8002:8002"

  litellm:
    image: ghcr.io/berriai/litellm:main-latest
    profiles: ["chat", "full"]
    restart: unless-stopped
    # Langfuse + upstream keys come from sync_librechat_env.sh → librechat/.env.
    # Do not override with ${VAR:-} here — empty compose substitution wipes env_file values.
    env_file:
      - ./librechat/.env
    environment:
      # macOS Podman: mount exported keychain bundle (see export_macos_certs.sh).
      SSL_CERT_FILE: /certs/ca-bundle.pem
      REQUESTS_CA_BUNDLE: /certs/ca-bundle.pem
    volumes:
      - ./litellm/litellm-config.yaml:/app/config.yaml:ro
      - ./litellm/certs/ca-bundle.pem:/certs/ca-bundle.pem:ro
    command: ["--config", "/app/config.yaml", "--port", "4000", "--host", "0.0.0.0"]
    ports:
      - "4000:4000"

  librechat:
    image: ghcr.io/danny-avila/librechat:latest
    profiles: ["chat", "full"]
    restart: unless-stopped
    depends_on:
      - librechat-mongodb
      - clickhouse-mcp
    env_file:
      - ./librechat/.env
    ports:
      - "3080:3080"
    environment:
      HOST: 0.0.0.0
      PORT: 3080
      MONGO_URI: mongodb://librechat-mongodb:27017/LibreChat
      ALLOW_REGISTRATION: "true"
      ALLOW_UNVERIFIED_EMAIL_LOGIN: "true"
      # custom = LiteLLM; agents = Agent Builder tab (required for Pulse MCP agent).
      ENDPOINTS: custom,agents
      LITELLM_BASE_URL: ${LITELLM_BASE_URL:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    volumes:
      - ./librechat/librechat.runtime.yaml:/app/librechat.yaml:ro
      - ./librechat/system_prompt.md:/app/pulse_system_prompt.md:ro

  backend:
    build: ./backend
    ports:
      - "8080:8080"
    environment:
      ADDR: ":8080"
      CLICKHOUSE_DSN: ${CLICKHOUSE_DSN:-clickhouse://default:@clickhouse:9000/sony_liv}
      REDIS_ADDR: ${REDIS_ADDR:-redis:6379}
      PREFLIGHT_ENABLED: ${PREFLIGHT_ENABLED:-true}
      PREFLIGHT_CACHE_TTL: ${PREFLIGHT_CACHE_TTL:-1m}
      # Always use in-compose collector hostname (localhost only works on host `go run`).
      OTEL_EXPORTER_OTLP_ENDPOINT: http://clickstack:4318
    depends_on:
      - redis

  frontend:
    build: ./frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  ch-data:
  librechat-mongo:
